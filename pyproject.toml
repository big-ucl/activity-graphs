[project]
name = "activity-graphs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair[all]>=5.5.0",
    "city2graph>=0.3.0",
    "contextily>=1.6.2",
    "fastexcel>=0.14.0",
    "folium>=0.12",
    "geopandas>=1.1.0",
    "hydra-core>=1.3.2",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.3",
    "omegaconf>=2.3.0",
    "pandas>=3.0.1",
    "polars[pyarrow]>=1.30.0",
    "pypolyline>=0.5.6",
    "pyproj>=3.7.1",
    "rapidfuzz>=3.14.3",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "lightning>=2.0",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "tqdm>=4.67.1",
    "torchmetrics>=1.9.0",
    "wandb>=0.27.0",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "nvitop>=1.6.2",
    "pandas-stubs~=3.0.0",
    "pdoc>=15",
    "pyrefly>=0.62.0",
    "pytest>=9.0.1",
    "ruff>=0.11.11",
    "scipy-stubs~=1.17.1",
    "types-geopandas>=1.1.4.20261006",
]
notebooks = [
    "marimo>=0.13.11",
]

[project.scripts]
activity-graphs = "activitygraphs.main:main"
report-results = "activitygraphs.main:report_results"

[tool.setuptools.packages.find]
include = ["activitygraphs*"]

[tool.uv]
package = true
default-groups = ["dev", "notebooks"]
no-build-isolation-package = [
  "torch-cluster",
  "torch-scatter",
  "torch-sparse",
  "torch-spline-conv",
  "torchaudio",
  "torchvision"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pyg_lib = [
  { index = "pyg-cu126" },
]
torch_scatter = [
  { index = "pyg-cu126" },
]
torch_sparse = [
  { index = "pyg-cu126" },
]
torch_cluster = [
  { index = "pyg-cu126" },
]
torch_spline_conv = [
  { index = "pyg-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.8.0+cu126.html"
format = "flat"
explicit = true

[tool.marimo.runtime]
pythonpath = ["."]
lsp = true
output_max_bytes = 30_000_000

[tool.marimo.language_servers.pylsp]
enabled = false

[tool.marimo.language_servers.pyrefly]
enabled = true

# Diagnostics configuration
[tool.marimo.diagnostics]
enabled = true               # Show diagnostics in the editor

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "D"]
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Enable preview style formatting.
preview = true

[tool.pyrefly]
project-includes = ["activitygraphs"]
python-version = "3.12"

[tool.pytest.ini_options]
markers = [
    "integration: tests that need processed data on disk; skipped automatically when absent",
]
