defaults:
  - _self_
  - data: tpg
  - model@models.mlp: mlp
  - model@models.gat: gat
  - model@models.gps: gps
  # The experiment to run, one of `conf/experiment/`: comparison, depth_sweep, demographics_ablation, overfit_health,
  # baselines.
  - experiment: comparison

paths:
  reports: reports
  runs: ${..paths.reports}/runs
  overfit: ${..paths.reports}/overfit
  figures: ${..paths.reports}/figures

# Keyword arguments of the Lightning Trainer of every learned model. Add other Trainer arguments with `+trainer.<arg>=`.
trainer:
  # Number of training epochs. Replaced by `train.overfit_epochs` while overfitting.
  max_epochs: 50
  accelerator: auto
  gradient_clip_val: 1.0
  # Enables Lightning fast-dev-run (no training but all code parts are run).
  fast_dev_run: false
  # Number of batches to train on (to test model overfit), disabled when = 0.
  overfit_batches: 0
  enable_progress_bar: true
  enable_model_summary: false

train:
  # Dataset split seed: kept same across models to ensure same data evaluation.
  split_seed: 42
  # Training seeds; each model is trained once per entry. Use several to measure run-to-run spread.
  train_seeds: [ 42, 43, 44 ]

  # DataLoader settings of every split.
  loader:
    # Batch size (number of user "graphs" per batch).
    batch_size: 64
    num_workers: 8
  # Size of the validation set (as a fraction of the total dataset size).
  val_size: 0.1
  # Size of the test set.
  test_size: 0.2

  # Learning rate forced on every architecture while overfitting. Set to null to keep the per-model rates.
  overfit_lr: 1e-2
  # Epochs to run while overfitting.
  overfit_epochs: 500
  # Use the ReduceLROnPlateau scheduler on the loss's monitored metric. Never used while overfitting.
  schedule_lr: true
  # Keyword arguments of ReduceLROnPlateau.
  lr_scheduler:
    factor: 0.5
    patience: 5
  # Home-anchored positional encoding: an RBF expansion of the hop distance to home, capped at `max_hops`.
  home_pe:
    bins: 8
    max_hops: 40
  # Number of probability bins of the calibration error.
  calibration_bins: 15
  # Enable PyTorch model compilation (Dynamo).
  compile: true
  # Enable the `OverfitDebugCallback` statistics, prints at the start and end of training.
  debug: false
  # Save each test user's full per-node score vector to the run's `scores.parquet`. Required by the
  # model-health checks; costs ~4 bytes per test user per node per model per seed.
  save_score_vectors: true
  # Log `train_avg_recall@K` on the training batches
  log_train_ranking: true
  # Largest size K of avg_recall@K (mean recall@k over k = 1..K).
  max_recall_k: 50
  # Enable Weights and Biases logging
  wandb: true
  # Weights and Biases project to submit logs to.
  wandb_project: activity-graphs
  # Weights and Biases entity.
  wandb_entity: luca-bataillard-ucl-university-college-london

  # Loss function configuration
  loss:
    # bce = Binary Cross Entropy loss function (classification), bpr = Bayesian Personalised Ranking (ranking)
    type: bpr

    # BPR configuration
    # Number of (pos, neg) pairs in BPR loss
    n_pairs: 128
    # Negative examples sampling strategy: uniform = Uniform Sampling, hard = Negatives sampled near home
    neg_sampler: uniform
    # Max distance for hard negative samples (number of hops)
    is_near_threshold: 5

analysis:
  # Reference model for paired per-user comparison.
  reference_model: Gravity
  # Aggregate test metric reported as mean +- sd over the training seeds.
  main_metric: test_avg_recall@50
  # Per-user metric used for the paired comparison.
  per_user_metric: avg_recall
  # Minimum size `|RG_i|` for a user to be included in analysis.
  min_realised_size: 3
  # Home-zone occupancy thresholds `t` reported as `share_users_ge_{t}`.
  occupancy_thresholds: [ 10, 25, 60 ]
  # List of points k at which to evaluate the recall@k
  recall_curve_ks: [ 1, 3, 5, 10, 20, 50 ]
  # Run number `n` of the run directory `{dataset}-{n}-{timestamp}`. null reads the latest.
  run: null
