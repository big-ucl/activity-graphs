# @package data
name: TTS2016
survey: tts
survey_version: 2016

inputs:
  raw_journeys: trip.csv
  raw_person: pers.csv
  raw_household: hhld.csv

  statistics:
    directory: ${...paths.external}/statistics/${...name}
    population: 98-401-X2016044_ONTARIO_eng_CSV/98-401-X2016044_ONTARIO_English_CSV_data.csv

  overture:
    directory: ${...paths.external}/overture/TTS
    land_use: land_use.geojson
    place: place.geojson

  boundaries:
    directory: ${...paths.external}/boundaries/canada

    zones: tts2022_2006zn_v2_shapefile.zip
    dissemination_areas: lda_000b16a_e.zip

paths:
  processed: data/processed/${..name}
  raw: data/raw/TTS/2016

  external: data/external
  gtfs: ${..paths.external}/gtfs

# Upper edges in km of the distance-from-home bands the within-band AUC is read on.
distance_bands: [ 1, 2, 3.5, 5, 7.5, 10, 12.5, 15, 20, 25, 30, 40, 50 ]

# Share of the training batches run each epoch, drawn from a fresh shuffle of the training users every epoch.
train_batch_fraction: 1.0

# Number of training epochs.
max_epochs: 50
