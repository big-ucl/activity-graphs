# @package data
name: GenevaTPG

inputs:
  raw_journeys: tpg_od.parquet

  overture:
    directory: ${...paths.external}/overture/${...name}
    land_use: land_use.geojson
    place: place.geojson

  statistics:
    directory: ${...paths.external}/statistics/${...name}
    file: AGGLO_CARREAU_200-SHP.zip

  boundaries:
    directory: ${...paths.external}/boundaries

    geneva_subsectors: GEO_GIREC-SHP/GEO_GIREC.shp
    french_postcodes: code_postaux_V5/codes_postaux_region.shp
    swiss_postcodes: ortschaftenverzeichnis_plz_2056.shp/AMTOVZ_SHP_LV95/AMTOVZ_ZIP.shp
    swiss_localities: ortschaftenverzeichnis_plz_2056.shp/AMTOVZ_SHP_LV95/AMTOVZ_LOCALITY.shp
    swiss_boundaries: swissboundaries3d_2025-04_2056_5728.shp/swissBOUNDARIES3D_1_5_TLM_HOHEITSGEBIET.shp

  gtfs:
    directory: gtfs_2022_switzerland

    stops: ${..gtfs.directory}/stops.txt
    stop_times: ${..gtfs.directory}/stop_times.txt
    trips: ${..gtfs.directory}/trips.txt
    routes: ${..gtfs.directory}/routes.txt
    agency: ${..gtfs.directory}/agency.txt
    calendar: ${..gtfs.directory}/calendar.txt
    calendar_dates: ${..gtfs.directory}/calendar_dates.txt
    transfers: ${..gtfs.directory}/transfers.txt

paths:
  processed: data/processed/${..name}
  raw: data/raw/${..name}

  external: data/external
  gtfs: ${..paths.external}/gtfs

  pyg_datasets: ${..paths.processed}/PyGDatasets

  act_dataset: ${..paths.processed}/act_dataset
  graphs: ${..paths.processed}/graphs
  metrics: ${..paths.processed}/metrics
  
# Upper edges in km of the distance-from-home bands the within-band AUC is read on.
distance_bands: [ 1, 2.5, 5, 10 ]
