# @package data
name: CMAP

inputs:
  raw_journeys: trip_linked.csv
  raw_person: person.csv
  raw_household: hh.csv

  statistics:
    directory: ${...paths.external}/statistics/${...name}
    population: ACSDT5Y2024.B01003-Data.csv
    jobs: il_wac_S000_JT00_2023.csv.gz

  overture:
    directory: ${...paths.external}/overture/${...name}
    land_use: land_use.geojson
    place: place.geojson

  boundaries:
    directory: ${...paths.external}/boundaries/usa

    census_tracts: tl_2020_17_tract.zip

paths:
  processed: data/processed/${..name}
  raw: data/raw/${..name}

  external: data/external
  gtfs: ${..paths.external}/gtfs

  pyg_datasets: ${..paths.processed}/PyGDatasets

# Upper edges in km of the distance-from-home bands the within-band AUC is read on.
distance_bands: [ 2, 5, 10, 25 ]
