# @package data
name: TTS2022
survey: tts
survey_version: 2022

inputs:
  raw_journeys: trip.csv
  raw_person: pers.csv
  raw_household: hhld.csv

  statistics:
    directory: ${...paths.external}/statistics/${...name}
    population: 98-401-X2021006_Ontario_eng_CSV/98-401-X2021006_English_CSV_data_Ontario.csv

  overture:
    directory: ${...paths.external}/overture/TTS
    land_use: land_use.geojson
    place: place.geojson

  boundaries:
    directory: ${...paths.external}/boundaries/canada

    zones: tts2022_2006zn_v2_shapefile.zip
    dissemination_areas: lda_000b21a_e.zip

  osm_extract: tts2022-230101-clipped.osm.pbf

  gtfs:
    service_date: "2022-10-19"
    feeds:
      ttc: TTS2022/TTC/tl-7a424234e95b.zip
      go: TTS2022/GO/mdb-727-20221015.zip
      up: TTS2022/UP/mdb-731-20220930.zip
      miway: TTS2022/MiWay/tl-aa5a65bb43f4.zip
      brampton: TTS2022/Brampton/mdb-729-20220810.zip
      yrt: TTS2022/YRT/mdb-728-20221014.zip
      drt: TTS2022/DRT/mdb-726-20220928.zip
      hsr: TTS2022/HSR/mdb-723-20220831.zip
      burlington: TTS2022/Burlington/tl-2ba5d0c10e53.zip
      oakville: TTS2022/Oakville/mdb-725-20220830.zip
      milton: TTS2022/Milton/tl-bc7aeaf89152.zip

paths:
  processed: data/processed/${..name}
  raw: data/raw/TTS/2022

  external: data/external
  gtfs: ${..paths.external}/gtfs
  osm: ${..paths.external}/osm

# Upper edges in km of the distance-from-home bands the within-band AUC is read on.
distance_bands: [ 1, 2, 3.5, 5, 7.5, 10, 12.5, 15, 20, 25, 30, 40, 50 ]

# Share of the training batches run each epoch, drawn from a fresh shuffle of the training users every epoch.
train_batch_fraction: 1.0

# Number of training epochs.
max_epochs: 50
