# @package data
name: THATS

inputs:
  raw_person: indivs.parquet
  raw_household: hhs.parquet
  raw_activities: activs.parquet
  raw_journeys: trips.parquet

  statistics:
    directory: ${...paths.external}/statistics/${...name}
    population: 98-401-X2021007_eng_CSV/98-401-X2021007_English_CSV_data.csv
    jobs: 98100470-eng/98100470.csv

  overture:
    directory: ${...paths.external}/overture/${...name}
    land_use: land_use.geojson
    place: place.geojson

  boundaries:
    directory: ${...paths.external}/boundaries/canada

    metropolitan_areas: lcma000b21a_e.zip
    census_tracts: lct_000b21a_e.zip
    dissemination_areas: lda_000b21a_e.zip

paths:
  processed: data/processed/${..name}
  raw: data/raw/${..name}

  external: data/external
  gtfs: ${..paths.external}/gtfs

  pyg_datasets: ${..paths.processed}/PyGDatasets